[tool.poetry]
name = "strava_project"
version = "1.0.0"
description = "Codebase for Strava data analysis."
authors = ["Craig Wilkinson"]
readme = "README.md"
packages = [
    { include = "strava_data", from = "src" },
    { include = "dashboard", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^3.0"
matplotlib = "^3.10"
seaborn = "^0.13"
requests = "^2.33"
pyAesCrypt = "^6.0"
cryptography = ">=44.0.1"
numpy = "^2.4"
scikit-learn = "^1.8"
plotly = "^6.9"
streamlit = "^1.59.2"
pyarrow = "^24.0"

[tool.poetry.group.dev.dependencies]
pylint = "^4.0"
pytest = "^9.0"
black = "^26.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']
include = 'src/.*\.pyi?$'
exclude = '''
/(
    \.venv
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.eggs
  | \.idea
  | __pycache__
  | build
  | dist
  | tests
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["src/tests"]

[tool.pylint.'MAIN']
max-line-length = 100
disable = [
    "missing-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "duplicate-code"
]